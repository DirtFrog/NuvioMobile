name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to run this manually with a button click

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: '0.2.9' # Forces it to use the 0.2.9 release tag
        fetch-depth: 0

    - name: Set up Java (Required for Kotlin Multiplatform)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Build Script Executable
      run: chmod +x ./scripts/build-distribution.sh

    - name: Run Build Script
      run: ./scripts/build-distribution.sh
      env:
        # If the script requires signing identity, you'd pass dummy variables here,
        # but for an unsigned/simulator IPA, this usually suffices.
        CI: true 

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NuvioMobile-iOS-IPA
        path: |
          build/ios/iphoneos/**/*.ipa
          iosApp/build/**/*.ipa
