name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo without broken recursive submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone MPVKit only
        run: |
          rm -rf MPVKit
          git clone --depth=1 https://github.com/tapframe/MPVNuvio.git MPVKit

      - name: Set up Java (Required for Kotlin Multiplatform)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Pre-compile Kotlin Shared Framework
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:compileReleaseKotlinIosArm64 || ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

      - name: Build iOS app for generic device
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_REQUIRED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          if [ -d "iosApp/build/Release-iphoneos/Nuvio.app" ]; then
            cp -r iosApp/build/Release-iphoneos/Nuvio.app Payload/
          else
            cp -r iosApp/build/Release-iphoneos/iosApp.app Payload/
          fi
          zip -r NuvioMobile.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-Unsigned-IPA
          path: NuvioMobile.ipa
